services:
  nginx:
    image: orthancteam/orthanc-nginx:26.8.0
    depends_on: [orthanc, orthanc-auth-service, keycloak]
    restart: unless-stopped
    # if setting ENABLE_HTTPS: "true" env var, uncomment the following 4 lines and comment the line with 'ports: ["80:80"]'
    #    ports: ["443:443"]
    #    volumes:
    #      - /.../crt.pem:/etc/nginx/tls/crt.pem
    #      - /.../key.pem:/etc/nginx/tls/key.pem
    networks:
      - default
      - xnat-network
    environment:
      ENABLE_ORTHANC: "true"
      ENABLE_KEYCLOAK: "true"
      ENABLE_ORTHANC_TOKEN_SERVICE: "false"
      ENABLE_HTTPS: "false"
      ENABLE_OHIF: "false"
      PYTHONIOENCODING: "utf-8"

  orthanc:
    build: orthanc
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
      - ${ORTHANC_CONFIG:-./orthanc.json}:/etc/orthanc/orthanc.json:ro
      - ./plugins:/opt/orthanc/plugins
      - ./assets/custom.css:/opt/orthanc/custom.css:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - /data:/data
    ports: ["4242:4242"]
    depends_on: [orthanc-db]
    restart: unless-stopped
    environment:
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "false"
      AUTH_SHARE_PASSWORD: "${AUTH_SHARE_PASSWORD}"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__POSTGRESQL__HOST: "orthanc-db"
      ORTHANC__POSTGRESQL__TRANSACTION_MODE: "ReadCommitted"
      VERBOSE_ENABLED: "true"
      VERBOSE_STARTUP: "true"
      PYTHONIOENCODING: "utf-8"
      BREVO_API_KEY: "${BREVO_API_KEY}"
      BREVO_EMAIL: "${SENDER_EMAIL}"
      BREVO_NAME: "${SENDER_NAME}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  orthanc-auth-service:
    image: orthancteam/orthanc-auth-service:26.8.0
    volumes:
      - ./permissions.jsonc:/orthanc_auth_service/permissions.json
    depends_on: [keycloak]
    restart: unless-stopped
    environment:
      SECRET_KEY: "${AUTH_SECRET_KEY}"
      ENABLE_KEYCLOAK: "true"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      PUBLIC_ORTHANC_ROOT: "http://pacs-neuro/orthanc/"
      PUBLIC_LANDING_ROOT: "http://pacs-neuro/orthanc/ui/app/token-landing.html"
      PUBLIC_OHIF_ROOT: "http://pacs-neuro/orthanc/ohif/"
      USERS: |
        {
          "share-user": "${AUTH_SHARE_PASSWORD}"
        }

  orthanc-db:
    image: postgres:14
    restart: unless-stopped
    volumes: ["orthanc-db:/var/lib/postgresql/data"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"

  keycloak:
    image: orthancteam/orthanc-keycloak:26.8.0
    depends_on:
      - keycloak-db
      - smtp-to-brevo
    restart: unless-stopped
    volumes:
      - ./email_theme:/opt/keycloak/themes/email_theme:ro
    #      - ./assets/onset_logo_no_bg.png:/opt/keycloak/themes/orthanc/login/resources/img/orthanc-logo-text.png:ro
    #      - ./assets/onset_logo_no_bg.png:/opt/keycloak/themes/orthanc/login/resources/img/orthanc-logo-text-shadow.png:ro
    #      - ./assets/background_50.png:/opt/keycloak/themes/orthanc/login/resources/img/keycloak-bg.png:ro
    #      - ./assets/login.css:/opt/keycloak/themes/orthanc/login/resources/css/login.css:ro
    environment:
      KC_THEME_CACHE_TEMPLATES: false
      KC_THEME_CACHE_THEMES: false
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: "http://pacs-neuro/keycloak"
      KC_EMAIL_HOST: smtp-to-brevo
      KC_EMAIL_PORT: 2525
      KC_EMAIL_FROM: pacs@neuro.com

  smtp-to-brevo:
    build: ./relay
    restart: unless-stopped
    environment:
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
      - PYTHONUNBUFFERED=1

  keycloak-db:
    image: postgres:14
    restart: unless-stopped
    volumes: ["keycloak-db:/var/lib/postgresql/data"]
    environment:
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_USER: "keycloak"
      POSTGRES_DB: "keycloak"

networks:
  default:
    ipam:
      config:
        - subnet: 10.254.2.0/24
  xnat-network:
    external: true

volumes:
  orthanc-storage:
  orthanc-db:
  keycloak-db:

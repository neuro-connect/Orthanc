services:

  nginx:
    image: orthancteam/orthanc-nginx:25.8.1
    depends_on: [orthanc, orthanc-auth-service, keycloak]
    restart: unless-stopped
    ports: ["80:80"]
# if setting ENABLE_HTTPS: "true" env var, uncomment the following 4 lines and comment the line with 'ports: ["80:80"]'
#    ports: ["443:443"]
#    volumes:
#      - /.../crt.pem:/etc/nginx/tls/crt.pem
#      - /.../key.pem:/etc/nginx/tls/key.pem
    environment:
      ENABLE_ORTHANC: "true"
      ENABLE_KEYCLOAK: "true"
      ENABLE_ORTHANC_TOKEN_SERVICE: "false"
      ENABLE_HTTPS: "false"
      ENABLE_OHIF: "false"
      PYTHONIOENCODING: "utf-8"

  orthanc:
    build: orthanc
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
      - ${ORTHANC_CONFIG:-./orthanc.json}:/etc/orthanc/orthanc.json:ro
      - ./plugins:/opt/orthanc/plugins
      - ./assets/custom.css:/opt/orthanc/custom.css:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - /data:/data
    ports: ["4242:4242"]
    depends_on: [orthanc-db]
    restart: unless-stopped
    environment:
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "false"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__POSTGRESQL__HOST: "orthanc-db"
      ORTHANC__POSTGRESQL__TRANSACTION_MODE: "ReadCommitted"
      VERBOSE_ENABLED: "true"
      VERBOSE_STARTUP: "true"
      PYTHONIOENCODING: "utf-8"
      BREVO_API_KEY: "change-me"
      BREVO_EMAIL: "name@host"
      BREVO_NAME: "name"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  orthanc-auth-service:
    image: orthancteam/orthanc-auth-service:25.8.1
    volumes:
      - ./permissions.jsonc:/orthanc_auth_service/permissions.json
    depends_on: [keycloak]
    restart: unless-stopped
    environment:
      SECRET_KEY: "change-me"
      ENABLE_KEYCLOAK: "true"
      KEYCLOAK_CLIENT_SECRET: "change-me"
      PUBLIC_ORTHANC_ROOT: "http://localhost/orthanc/"
      PUBLIC_LANDING_ROOT: "http://localhost/orthanc/ui/app/token-landing.html"
      PUBLIC_OHIF_ROOT: "http://localhost/orthanc/ohif/"
      USERS: |
        {
          "share-user": "change-me"
        }

  orthanc-db:
    image: postgres:14
    ports: ["5432:5432"]
    restart: unless-stopped
    volumes: ["orthanc-db:/var/lib/postgresql/data"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"


  keycloak:
    image: orthancteam/orthanc-keycloak:25.8.1
    depends_on:
      - keycloak-db
      - smtp-to-brevo
    restart: unless-stopped
    volumes:
      - ./email_theme:/opt/keycloak/themes/email_theme:ro
#      - ./assets/onset_logo_no_bg.png:/opt/keycloak/themes/orthanc/login/resources/img/orthanc-logo-text.png:ro
#      - ./assets/onset_logo_no_bg.png:/opt/keycloak/themes/orthanc/login/resources/img/orthanc-logo-text-shadow.png:ro
#      - ./assets/background_50.png:/opt/keycloak/themes/orthanc/login/resources/img/keycloak-bg.png:ro
#      - ./assets/login.css:/opt/keycloak/themes/orthanc/login/resources/css/login.css:ro
    environment:
      KC_THEME_CACHE_TEMPLATES: false
      KC_THEME_CACHE_THEMES: false
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "change-me"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "2HrYL7yhnt8DfcYSRAK0v"
      KC_HOSTNAME: "http://localhost/keycloak"
      KC_EMAIL_HOST: smtp-to-brevo
      KC_EMAIL_PORT: 2525
      KC_EMAIL_FROM: pacs@theonsetlab.com

  smtp-to-brevo:
    build: ./relay
    restart: unless-stopped
    ports: ["2525:2525"]
    environment:
      - BREVO_API_KEY=change-me # REMPLACER PAR VOTRE CLÉ
      - SENDER_EMAIL=name@host # DOIT ÊTRE VALIDÉ SUR BREVO
      - SENDER_NAME=name
      - PYTHONUNBUFFERED=1

  keycloak-db:
    image: postgres:14
    restart: unless-stopped
    volumes: ["keycloak-db:/var/lib/postgresql/data"]
    environment:
      POSTGRES_PASSWORD: "change-me"
      POSTGRES_USER: "keycloak"
      POSTGRES_DB: "keycloak"

volumes:
  orthanc-storage:
  orthanc-db:
  keycloak-db:
